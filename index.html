<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>StaRacer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet" />
</head>
<body>

<!-- ═══════════════════════════════ LANDING PAGE ═══════════════════════════ -->
<div id="landing">
  <div id="landing-inner">
    <h1 id="logo">STA<span>RACER</span></h1>

    <div id="config-grid">

      <!-- Track -->
      <section class="config-section">
        <h3>TRACK</h3>
        <div id="track-list"></div>
      </section>

      <!-- Car -->
      <section class="config-section">
        <h3>CAR</h3>
        <div id="car-list"></div>
        <div id="car-desc"></div>
        <div id="car-stats"></div>
      </section>

      <!-- Difficulty -->
      <section class="config-section">
        <h3>DIFFICULTY</h3>
        <div id="diff-list"></div>
      </section>

      <!-- Controller -->
      <section class="config-section">
        <h3>CONTROLS</h3>
        <div id="ctrl-list">
          <button class="ctrl-btn pill" data-ctrl="keyboard">⌨ Keyboard</button>
          <button class="ctrl-btn pill" data-ctrl="mouse">🖱 Mouse</button>
        </div>
        <div id="ctrl-hint">W/S = throttle/brake · A/D = steer · Space = handbrake</div>
      </section>

    </div>

    <!-- Scores -->
    <div id="scores-panel">
      <div id="scores-header">Best Times</div>
      <div id="scores-list"></div>
    </div>

    <button id="start-btn">START RACE</button>
  </div>
</div>

<!-- Three.js render surface — must exist in DOM before main.ts runs -->
<canvas id="canvas"></canvas>

<!-- ════════════════════════════════ GAME UI ═══════════════════════════════ -->
<div id="game-ui" style="display:none">

  <!-- HUD top-left: all stats in one panel (matches reference) -->
  <div id="hud-tl">
    <div id="hud-stats-panel">
      <div class="hstat"><div class="hsl">SPEED</div><div class="hsv" id="speed-display">000</div></div>
      <div class="hstat-div"></div>
      <div class="hstat"><div class="hsl">LAP</div><div class="hsv"><span id="lap">1</span><span class="hsdenom">/3</span></div></div>
      <div class="hstat-div"></div>
      <div class="hstat"><div class="hsl">TIME</div><div class="hsv" id="time">0:00.0</div></div>
      <div class="hstat-div"></div>
      <div class="hstat"><div class="hsl">BEST</div><div class="hsv" id="best">--:--.---</div></div>
      <div class="hstat-div"></div>
      <div class="hstat"><div class="hsl">DRAFT</div><div class="hsv" id="draft-val">OFF</div></div>
    </div>
  </div>

  <!-- Minimap top-right -->
  <div id="hud-tr">
    <canvas id="minimap" width="140" height="140"></canvas>
  </div>

  <!-- Leaderboard bottom-right -->
  <div id="hud-br">
    <div id="leaderboard"></div>
  </div>

  <!-- Countdown / finish overlay -->
  <div id="hud-center" style="display:none">
    <div id="countdown"></div>
    <div id="finish"></div>
  </div>

  <!-- Respawn overlay -->
  <div id="respawn-overlay" style="display:none">
    <div id="respawn-text">RESPAWNING</div>
    <div id="respawn-num">3</div>
  </div>

  <!-- Hidden compat elements -->
  <span id="pos-num" style="display:none">1</span>
  <div id="draft-bar" style="display:none"></div>

</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
