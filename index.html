<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StaRacer</title>
</head>
<body>

<!-- ═══════════════════════════════ LANDING PAGE ═══════════════════════════ -->
<div id="landing">
  <div id="landing-inner">
    <h1 id="logo">STA<span>RACER</span></h1>

    <div id="config-grid">

      <!-- Track -->
      <section class="config-section">
        <h3>TRACK</h3>
        <div id="track-list"></div>
      </section>

      <!-- Car -->
      <section class="config-section">
        <h3>CAR</h3>
        <div id="car-list"></div>
        <div id="car-desc"></div>
        <div id="car-stats"></div>
      </section>

      <!-- Difficulty -->
      <section class="config-section">
        <h3>DIFFICULTY</h3>
        <div id="diff-list"></div>
      </section>

      <!-- Controller -->
      <section class="config-section">
        <h3>CONTROLS</h3>
        <div id="ctrl-list">
          <button class="ctrl-btn pill" data-ctrl="keyboard">⌨ Keyboard</button>
          <button class="ctrl-btn pill" data-ctrl="mouse">🖱 Mouse</button>
        </div>
        <div id="ctrl-hint">W/S = throttle/brake · A/D = steer · Space = handbrake</div>
      </section>

    </div>

    <!-- Scores -->
    <div id="scores-panel">
      <div id="scores-header">Best Times</div>
      <div id="scores-list"></div>
    </div>

    <button id="start-btn">START RACE</button>
  </div>
</div>

<!-- ════════════════════════════════ GAME UI ═══════════════════════════════ -->
<div id="game-ui" style="display:none">

  <!-- HUD top-left -->
  <div id="hud-tl">
    <div id="hud-lap">LAP <span id="lap">1 / 3</span></div>
    <div id="hud-pos">P<span id="pos-num">1</span></div>
  </div>

  <!-- HUD top-right -->
  <div id="hud-tr">
    <div id="hud-time"><span id="time">0:00.0</span></div>
    <div id="hud-best">BEST <span id="best">--:--.–</span></div>
  </div>

  <!-- Speed (bottom center) -->
  <div id="hud-speed">
    <span id="speed-display">000</span>
    <span id="speed-unit">km/h</span>
  </div>

  <!-- Draft bar -->
  <div id="hud-draft">
    <div id="draft-track"><div id="draft-bar"></div></div>
    <span id="draft-val">DRAFT</span>
  </div>

  <!-- Minimap -->
  <canvas id="minimap" width="120" height="120"></canvas>

  <!-- Countdown / finish overlay -->
  <div id="hud-center" style="display:none">
    <div id="countdown"></div>
    <div id="finish"></div>
  </div>

  <!-- Respawn overlay -->
  <div id="respawn-overlay" style="display:none">
    <div id="respawn-text">RESPAWNING</div>
    <div id="respawn-num">3</div>
  </div>

</div>

<canvas id="canvas"></canvas>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
