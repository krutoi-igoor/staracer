<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StaRacer</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <canvas id="canvas"></canvas>
    <div id="hud">
      <div id="hud-tl">
        <div class="label">LAP</div>
        <div id="lap" class="val">1 / 3</div>
        <div class="label">TIME</div>
        <div id="time" class="val">0:00.0</div>
        <div class="label">BEST</div>
        <div id="best" class="val">--:--.-</div>
      </div>
      <div id="hud-tr">
        <canvas id="minimap" width="120" height="120"></canvas>
      </div>
      <div id="hud-bl">
        <div class="label">DRAFT</div>
        <div id="draft-wrap"><div id="draft-bar"></div></div>
        <div id="draft-val" class="val">OFF</div>
      </div>
      <div id="hud-br">
        <div id="pos-display">P<span id="pos-num">8</span></div>
        <div class="label" style="text-align:right">SPEED</div>
        <div id="speed-display">000</div>
      </div>
      <div id="hud-center">
        <div id="countdown"></div>
        <div id="finish"></div>
      </div>
    </div>
  </div>
  <div id="controls-hint">W/S — throttle/brake &nbsp; A/D — steer &nbsp; SPACE — handbrake</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
